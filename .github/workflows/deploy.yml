name: Build & Deploy widget to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build:widget

      - name: Prepare publish folder
        run: |
          mkdir -p publish
          cp dist/widget.js publish/widget.js
          cp examples/external-test.html publish/external-test.html
          # external-test.html은 ../dist/widget.js로 참조 → ./widget.js로 교체
          sed -i 's|../dist/widget.js|./widget.js|' publish/external-test.html
          cp public/index.html publish/index.html

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
