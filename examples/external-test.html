<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>외부 사이트 시뮬레이션 - 다른 회사 웹페이지</title>
    <style>
      /* 호스트 페이지가 가질법한 거친 글로벌 CSS — 위젯이 영향받는지 확인용 */
      * { color: red !important; box-sizing: content-box; }
      button { background: lime !important; padding: 50px !important; }
      input { border: 5px dashed purple !important; }
      body {
        margin: 0;
        font-family: serif;
        background: #1a1a2e;
        color: #eee !important;
      }
      .page {
        max-width: 720px;
        margin: 60px auto;
        padding: 40px;
        background: #16213e;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <h1>완전 다른 회사의 웹페이지 (다크 테마 + 깡패 CSS)</h1>
      <p>
        이 페이지는 일부러 모든 button, input에 강제 스타일을 넣었어요.
        Shadow DOM이 제대로 격리하면 우리 위젯은 멀쩡해야 합니다.
      </p>
      <button>이건 호스트 페이지의 버튼 (초록 + 50px 패딩)</button>
      <input placeholder="이건 호스트 input (보라 점선)" />
    </div>

    <!-- 이 한 줄이 전부. 빌드 후 dist/widget.js 가 생성됨 -->
    <script src="../dist/widget.js" defer></script>
  </body>
</html>
